server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:800}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:25000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:2000}
    connection-timeout: 5000ms

spring:
  application:
    name: RLaaS

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rlaas_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 250ms
      lettuce:
        shutdown-timeout: 100ms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,info,metrics}
  endpoint:
    health:
      show-details: always
